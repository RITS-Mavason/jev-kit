# The three checks CLAUDE.md requires. The `main` ruleset requires a status
# check named `check`, which is the Linux job; check-macos reports too but is
# not required.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/check_docs.py
      - run: python3 tools/check_prose.py README.md

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/check_docs.py
      - run: python3 tools/check_prose.py README.md
